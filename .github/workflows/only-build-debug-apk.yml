name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API Gateway base URL (bỏ trống để dùng vars.VITE_API_BASE_URL)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-debug-apk-build
  cancel-in-progress: false

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.CLUBHUB_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_API_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
      EXPO_PUBLIC_DEV_ACCESS_TOKEN: ${{ secrets.CLUBHUB_DEV_ACCESS_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Google client ID injected
        run: |
          # Không in GIÁ TRỊ (secret) — chỉ hiện có/đủ không + độ dài, để log CI
          # tự nói được client ID đã được nạp từ secrets vào build chưa.
          if [ -n "${EXPO_PUBLIC_GOOGLE_CLIENT_ID}" ]; then
            echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID: present (length=${#EXPO_PUBLIC_GOOGLE_CLIENT_ID}, ends ...${EXPO_PUBLIC_GOOGLE_CLIENT_ID: -30})"
          else
            echo "::error::EXPO_PUBLIC_GOOGLE_CLIENT_ID is EMPTY — secret CLUBHUB_GOOGLE_CLIENT_ID chưa được định nghĩa (repo/org settings → Secrets & variables → Actions). Build sẽ thiếu Google Sign-In."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      # QUAN TRỌNG — dùng profile "debugApk" (KHÔNG phải "development").
      # "development" là dev-client (developmentClient:true) → JS bundle KHÔNG
      # được nhúng vào APK, app phải kéo JS từ Metro (.env local) ⇒ client ID
      # trong CI secrets KHÔNG đến được app chạy.
      # "debugApk" là non-dev-client → nhúng JS (EXPO_PUBLIC_* được inline từ
      # env của CI, gồm secret CLUBHUB_GOOGLE_CLIENT_ID) ⇒ APK tự-chứa, cài được.
      - name: Build Debug APK locally via EAS
        run: |
          npx --yes eas-cli build \
            --platform android \
            --profile debugApk \
            --local \
            --non-interactive \
            --output ./app-debug.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify client ID actually inlined into the APK
        run: |
          # Bước Verify bên trên chỉ chứng minh secret CÓ TRONG MÔI TRƯỜNG CI.
          # Bước này chứng minh client ID ĐÃ BỊ INLINE VÀO JS bundle trong APK
          # (bằng chứng vật lý). Nếu fail → EXPO_PUBLIC_* không được nhúng
          # (đúng dev-client, hoặc bundler không inherit env CI).
          python3 - <<'PYEOF'
          import os, sys, zipfile
          apk = "app-debug.apk"
          cid = os.environ.get("EXPO_PUBLIC_GOOGLE_CLIENT_ID", "").strip()
          if not cid:
            print("SKIP: EXPO_PUBLIC_GOOGLE_CLIENT_ID empty in env")
            sys.exit(0)
          with zipfile.ZipFile(apk) as z:
            bundles = [n for n in z.namelist() if n.endswith(".bundle")]
            if not bundles:
              print("::error::No JS bundle found in APK — build này là dev-client (JS không nhúng).")
              print("Bundle candidates:", [n for n in z.namelist() if "assets" in n][:20])
              sys.exit(1)
          for name in bundles:
            with zipfile.ZipFile(apk) as z:
              data = z.read(name)
            print(f"Bundle: {name} ({len(data)} bytes)")
            if cid.encode() in data:
              print(f"OK: EXPO_PUBLIC_GOOGLE_CLIENT_ID (length={len(cid)}) đã được inline vào bundle.")
              sys.exit(0)
          print(f"::error::Client ID KHÔNG có trong JS bundle của {apk} — inlining EXPO_PUBLIC_* thất bại (dev-client hoặc env CI không đến bundler).")
          sys.exit(1)
          PYEOF

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          retention-days: 30
          if-no-files-found: error